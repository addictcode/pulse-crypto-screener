name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # integration tests start PostgreSQL with Testcontainers; the runner has Docker
      - run: ./gradlew build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: No server configured yet
        if: env.VPS_HOST == ''
        run: echo "Set the VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets to deploy on every push to main."
      - name: Deploy over SSH
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh pulse@"$VPS_HOST" 'cd /opt/pulse && git pull --ff-only && docker compose -f compose.prod.yaml up -d --build --remove-orphans && docker image prune -f'
