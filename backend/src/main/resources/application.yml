spring:
  application:
    name: pulse-backend
  config:
    # secrets for local runs (Telegram token, owner chat id); gitignored
    import: optional:file:./config/local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    # in development docker compose support overrides these with the compose.yaml database
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5433/pulse}
    username: ${PULSE_DB_USER:pulse}
    password: ${PULSE_DB_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  docker:
    compose:
      # keep the database running between app restarts
      lifecycle-management: start-only

server:
  port: 8080
  # behind Caddy: trust X-Forwarded-* for scheme and client address
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # not reachable from outside: Caddy only proxies /api and /ws
      show-details: always

pulse:
  binance:
    enabled: true
    rest-url: https://fapi.binance.com
    # the legacy /stream endpoint accepts subscriptions but delivers nothing
    stream-url: wss://fstream.binance.com/market/stream
    # order book diff streams are only served on the public endpoint
    public-stream-url: wss://fstream.binance.com/public/stream
    # a 1000-level snapshot costs 20 weight; one per second stays well inside the 2400/min budget
    depth-snapshots-per-second: 1
    weight-limit: 2000
    kline-history: 120
    max-streams-per-connection: 800
    rest-requests-per-second: 15
    open-interest-poll: 60s
    stale-after: 30s
  bybit:
    enabled: ${PULSE_BYBIT_ENABLED:true}
    rest-url: https://api.bybit.com
    # one request returns every linear contract, so polling is cheap
    poll: 5s
  stream:
    broadcast-interval-ms: 500
    # comma separated; in production the public https origin
    allowed-origins: ${PULSE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  density:
    enabled: true
    books: 60
    reselect-interval: 10m
    scan-interval-ms: 1000
    max-distance-pct: 5
    prune-distance-pct: 10
    bucket-pct: 0.05
    multiple: 8
    min-notional: 25000
    volume-share: 0.0003
    max-per-side: 3
  # Pulse Setups across the market: found once per closed candle, journalled, followed to the end
  setups:
    enabled: ${PULSE_SETUPS_ENABLED:true}
    timeframes: [15m, 1h]
    pairs: 40
    # Breakouts come in bursts when the whole market moves, and trades taken in one burst win or
    # lose together. Over 30 days and 40 pairs a cap of 5 to 8 open trades cut the worst losing
    # run two to four times and kept both halves of the period in profit; without it the second
    # half made nothing.
    max-open: 6
  signals:
    enabled: true
    scan-interval-ms: 2000
    # no signals right after startup while metrics settle
    warmup: 2m
    # pumps and dumps on tiny markets are noise
    min-volume24h: 5000000
    # a repeat inside the cooldown still fires if it is this much stronger
    escalation: 1.5
  # a made-up market instead of the exchanges, for load tests (loadtest/); never on a public site
  fake-market:
    enabled: ${PULSE_FAKE_MARKET_ENABLED:false}
    symbols: 530
    books: 60
  limits:
    # the terminal makes a dozen calls on load and a few every ten seconds after
    requests-per-minute: 120
    burst: 60
    # each stream client costs a ~450 KB snapshot and then ~40 KB/s before compression
    stream-clients: ${PULSE_STREAM_CLIENTS:300}
    # one mobile operator puts thousands of phones behind one IPv4 address (CGNAT); IPv6 counts by /64
    stream-clients-per-address: ${PULSE_STREAM_CLIENTS_PER_ADDRESS:30}
  telegram:
    enabled: ${PULSE_TELEGRAM_ENABLED:false}
    token: ${PULSE_TELEGRAM_TOKEN:}
    owner-chat-id: ${PULSE_TELEGRAM_OWNER_CHAT_ID:}
    api-url: https://api.telegram.org
    # anyone can /start the bot; false keeps it to the owner
    open: ${PULSE_TELEGRAM_OPEN:false}
    # the free showcase: strong signals only, a few minutes after the bot, a few an hour
    channel: ${PULSE_TELEGRAM_CHANNEL:}
    channel-delay: 5m
    channel-per-hour: 6
    channel-strength: 2
    # for the Telegram buttons on the site; empty means the name Telegram reports for the token
    bot-username: ${PULSE_TELEGRAM_BOT_USERNAME:}
    # the daily digest in the channel at this hour, UTC (0-23); empty: no digest. /digest works anyway
    digest-hour: ${PULSE_TELEGRAM_DIGEST_HOUR:}
    digest-lang: ${PULSE_TELEGRAM_DIGEST_LANG:en}
    # every subscriber's week on Mondays at this hour, UTC; -1 never. Each can say /weekly off
    weekly-hour: ${PULSE_TELEGRAM_WEEKLY_HOUR:9}
    # channel posts link here, tagged utm_source=telegram: the permanent link follows the site
    # wherever it runs (tunnel or server); empty: no link
    site-url: ${PULSE_SITE_URL:https://addictcode.github.io/pulse-crypto-screener/}
  # Paid premium through Telegram Stars. Prepared, switched off: /premium only says it is not on
  # sale, no invoice goes out, and nothing free users get changes either way.
  premium:
    enabled: ${PULSE_PREMIUM_ENABLED:false}
    # price of one period in Telegram Stars (XTR)
    price-stars: 250
    days: 30
    title: Pulse Premium
    description: Support Pulse and get the extras below for 30 days. Market data, not financial advice.
    # what premium gives, as shown in /premium; describing it does not switch anything on
    perks:
      - Supports the development of Pulse
  # Web push without Telegram. Off until both VAPID keys are set (deploy/vapid-keys.mjs makes a
  # pair); without them the site does not offer notifications at all.
  push:
    vapid-public-key: ${PULSE_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PULSE_VAPID_PRIVATE_KEY:}
    # who to contact about these pushes, as push services ask: mailto: or https:
    subject: ${PULSE_VAPID_SUBJECT:mailto:pulse@example.com}
    # at most this many notifications an hour to one browser, however busy the market
    per-hour: 4
    # requests a second to push services; a burst of signals waits in the queue
    per-second: 20
    # only signals this many times past the system floor, for subscriptions that ask for strong ones
    strength: 2
    # push services a subscription may point at; anything else is refused (no requests to arbitrary hosts)
    allowed-hosts: fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,web.push.apple.com,notify.windows.com
    max-symbols: 50
