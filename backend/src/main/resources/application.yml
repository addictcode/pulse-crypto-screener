spring:
  application:
    name: pulse-backend
  config:
    # secrets for local runs (Telegram token, owner chat id); gitignored
    import: optional:file:./config/local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    # in development docker compose support overrides these with the compose.yaml database
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5433/pulse}
    username: ${PULSE_DB_USER:pulse}
    password: ${PULSE_DB_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  docker:
    compose:
      # keep the database running between app restarts
      lifecycle-management: start-only

server:
  port: 8080
  # behind Caddy: trust X-Forwarded-* for scheme and client address
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # not reachable from outside: Caddy only proxies /api and /ws
      show-details: always

pulse:
  binance:
    enabled: true
    rest-url: https://fapi.binance.com
    # the legacy /stream endpoint accepts subscriptions but delivers nothing
    stream-url: wss://fstream.binance.com/market/stream
    # order book diff streams are only served on the public endpoint
    public-stream-url: wss://fstream.binance.com/public/stream
    # a 1000-level snapshot costs 20 weight; one per second stays well inside the 2400/min budget
    depth-snapshots-per-second: 1
    weight-limit: 2000
    kline-history: 120
    max-streams-per-connection: 800
    rest-requests-per-second: 15
    open-interest-poll: 60s
    stale-after: 30s
  bybit:
    enabled: ${PULSE_BYBIT_ENABLED:true}
    rest-url: https://api.bybit.com
    # one request returns every linear contract, so polling is cheap
    poll: 5s
  stream:
    broadcast-interval-ms: 500
    # comma separated; in production the public https origin
    allowed-origins: ${PULSE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  density:
    enabled: true
    books: 60
    reselect-interval: 10m
    scan-interval-ms: 1000
    max-distance-pct: 5
    prune-distance-pct: 10
    bucket-pct: 0.05
    multiple: 8
    min-notional: 25000
    volume-share: 0.0003
    max-per-side: 3
  signals:
    enabled: true
    scan-interval-ms: 2000
    # no signals right after startup while metrics settle
    warmup: 2m
    # pumps and dumps on tiny markets are noise
    min-volume24h: 5000000
    # a repeat inside the cooldown still fires if it is this much stronger
    escalation: 1.5
  telegram:
    enabled: ${PULSE_TELEGRAM_ENABLED:false}
    token: ${PULSE_TELEGRAM_TOKEN:}
    owner-chat-id: ${PULSE_TELEGRAM_OWNER_CHAT_ID:}
    api-url: https://api.telegram.org
