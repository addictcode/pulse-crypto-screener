<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pulse, a radar for crypto futures</title>
<meta name="description" content="Pulse: a real-time screener for Binance USDT perpetuals. This page opens the live demo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 21 7v10l-9 5-9-5V7z' fill='%230a0c11' stroke='%234db8ff' stroke-width='1.5'/%3E%3Cpath d='M12 12 21 7M12 12v10M12 12 3 7' fill='none' stroke='%234db8ff' stroke-width='1.5' opacity='.5'/%3E%3C/svg%3E">
<style>
  /* This page lives on GitHub Pages and only forwards to wherever Pulse is running right now. */
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0a0c11; color: #e7eaf0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; }
  svg { width: 34px; height: 34px; color: #4db8ff; }
  h1 { margin-top: 18px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin-top: 10px; color: #a3abba; }
  a { color: #4db8ff; }
  .state { margin-top: 22px; display: flex; align-items: center; gap: 10px; color: #e7eaf0; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #f0b90b; }
  .state.off .dot { background: #f6465d; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12 21 7M12 12v10M12 12 3 7" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/></svg>
  <h1>Pulse</h1>
  <p id="about"></p>
  <p class="state" id="state" role="status"><span class="dot"></span><span id="state-text"></span></p>
  <p id="more"></p>
</main>
<script>
  // The live demo runs on its author's computer behind a tunnel whose address changes on every
  // restart. deploy/home.sh writes the current one to url.txt on the "live" branch.
  const REPO = 'addictcode/pulse-crypto-screener';
  const ru = (navigator.language || '').toLowerCase().startsWith('ru');
  const say = (en, russian) => (ru ? russian : en);
  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = ru ? 'ru' : 'en';
  $('about').textContent = say(
    'A real-time screener for Binance USDT perpetuals: the whole market, order book walls, signals and what followed them.',
    'Реалтайм-скринер USDT-фьючерсов Binance: весь рынок, стены в стакане, сигналы и то, что было после них.',
  );
  $('state-text').textContent = say('Looking for the live demo', 'Ищем живое демо');
  $('more').innerHTML = say('Source code: ', 'Исходный код: ') + `<a href="https://github.com/${REPO}">github.com/${REPO}</a>`;

  function offline() {
    $('state').classList.add('off');
    $('state-text').textContent = say(
      'The demo is offline right now. It runs on the author\'s computer, so it is up when that computer is.',
      'Демо сейчас не в сети. Оно работает на компьютере автора и доступно, когда тот включён.',
    );
  }

  async function currentAddress() {
    const fresh = await fetch(`https://api.github.com/repos/${REPO}/contents/url.txt?ref=live`, {
      headers: { Accept: 'application/vnd.github.raw' },
    }).catch(() => null);
    // the API allows 60 requests an hour per visitor; the CDN copy is the fallback, up to 5 minutes old
    const response = fresh && fresh.ok ? fresh : await fetch(`https://raw.githubusercontent.com/${REPO}/live/url.txt`);
    if (!response.ok) throw new Error(String(response.status));
    const address = (await response.text()).trim();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(address)) throw new Error('unexpected address');
    return address;
  }

  currentAddress()
    .then(async (address) => {
      // resolves when the host answers at all, rejects when the tunnel is gone
      await fetch(`${address}/api/status`, { mode: 'no-cors' });
      $('state-text').textContent = say('Opening Pulse', 'Открываем Pulse');
      location.replace(address + '/' + location.hash);
    })
    .catch(offline);
</script>
</body>
</html>
