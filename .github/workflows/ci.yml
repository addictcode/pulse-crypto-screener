name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # integration tests start PostgreSQL with Testcontainers; the runner has Docker
      - run: ./gradlew build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # what ships to visitors must have no known high or critical holes; dev tools are not shipped
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      # end-to-end: the real frontend in a real browser against a fake backend (web/e2e)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
          pip install numpy
      - run: npm ci
      - run: npx tsc --noEmit
      # the story, the words (no ticker, date or clock), the archive search, every event's candles
      - run: npm test
      # one video of every template in both languages: a broken template fails here
      - name: Render one video per template
        env:
          CHROME: /usr/bin/google-chrome
          LOG: warn
        run: |
          npm run render -- --per-template 1
          npm run render -- --per-template 1 --lang en
      - run: python3 scripts/check.py $(find out -name '*.mp4' | sort)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-check
          path: |
            video/out/**/*.mp4
          retention-days: 7
          compression-level: 0

  deploy:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: No server configured yet
        if: env.VPS_HOST == ''
        run: echo "Set the VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets to deploy on every push to main."
      - name: Deploy over SSH
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh pulse@"$VPS_HOST" 'cd /opt/pulse && git pull --ff-only && docker compose -f compose.prod.yaml up -d --build --remove-orphans && docker image prune -f'
