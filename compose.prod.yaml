# Production stack: `docker compose -f compose.prod.yaml up -d --build`
# Settings come from .env next to this file (see .env.example).
name: pulse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build: ./backend
    # the default is the name Compose gives a local build; a server set up to pull ready images
    # names them in .env (PULSE_BACKEND_IMAGE, see deploy/update.sh)
    image: ${PULSE_BACKEND_IMAGE:-pulse-backend}:${PULSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PULSE_DB_URL: jdbc:postgresql://postgres:5432/pulse
      PULSE_DB_USER: pulse
      PULSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PULSE_ALLOWED_ORIGINS: ${PULSE_PUBLIC_ORIGIN:-https://${PULSE_DOMAIN}}
      PULSE_TELEGRAM_ENABLED: ${PULSE_TELEGRAM_ENABLED:-false}
      PULSE_TELEGRAM_TOKEN: ${PULSE_TELEGRAM_TOKEN:-}
      PULSE_TELEGRAM_OWNER_CHAT_ID: ${PULSE_TELEGRAM_OWNER_CHAT_ID:-}
      PULSE_TELEGRAM_OPEN: ${PULSE_TELEGRAM_OPEN:-false}
      PULSE_TELEGRAM_CHANNEL: ${PULSE_TELEGRAM_CHANNEL:-}
      PULSE_TELEGRAM_BOT_USERNAME: ${PULSE_TELEGRAM_BOT_USERNAME:-}
      PULSE_TELEGRAM_DIGEST_HOUR: ${PULSE_TELEGRAM_DIGEST_HOUR:-}
      PULSE_TELEGRAM_DIGEST_LANG: ${PULSE_TELEGRAM_DIGEST_LANG:-en}
      PULSE_TELEGRAM_WEEKLY_HOUR: ${PULSE_TELEGRAM_WEEKLY_HOUR:-9}
      PULSE_SITE_URL: ${PULSE_SITE_URL:-https://addictcode.github.io/pulse-crypto-screener/}
      PULSE_PREMIUM_ENABLED: ${PULSE_PREMIUM_ENABLED:-false}
      # web push: on only with both keys (node deploy/vapid-keys.mjs)
      PULSE_VAPID_PUBLIC_KEY: ${PULSE_VAPID_PUBLIC_KEY:-}
      PULSE_VAPID_PRIVATE_KEY: ${PULSE_VAPID_PRIVATE_KEY:-}
      PULSE_VAPID_SUBJECT: ${PULSE_VAPID_SUBJECT:-mailto:pulse@example.com}
      PULSE_STREAM_CLIENTS: ${PULSE_STREAM_CLIENTS:-300}
      # browser errors from visitors, summed up once a day (web/src/client-errors.ts)
      PULSE_CLIENT_ERRORS_ENABLED: ${PULSE_CLIENT_ERRORS_ENABLED:-true}
      # the nightly check of signals against the exchange's candles (README, «Сигналы»)
      PULSE_AUDIT_ENABLED: ${PULSE_AUDIT_ENABLED:-true}
      PULSE_STREAM_CLIENTS_PER_ADDRESS: ${PULSE_STREAM_CLIENTS_PER_ADDRESS:-30}
    # the heap is 70% of this (MaxRAMPercentage in the Dockerfile); raise both together on a server
    mem_limit: ${PULSE_BACKEND_MEMORY:-1536m}
    # the image has neither curl nor wget, so bash speaks HTTP itself. "Healthy" means the market
    # feed is alive, not merely that the JVM runs (see MarketHealthIndicator).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: *logging

  web:
    build: ./web
    image: ${PULSE_WEB_IMAGE:-pulse-web}:${PULSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PULSE_SITE_ADDRESS: ${PULSE_SITE_ADDRESS:-${PULSE_DOMAIN}}
    ports:
      - "${PULSE_HTTP_PORT:-80}:80"
      - "${PULSE_HTTPS_PORT:-443}:443"
      - "${PULSE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db:
  caddy-data:
  caddy-config:
