name: video

# Renders a batch of the vertical videos (video/) and hands them over as artifacts, so a batch
# needs no Mac. Ways to start it:
#   - Actions → video → Run workflow, with the inputs below;
#   - pushing a tag video-batch-<anything>: the full batch, both languages, up to number 400;
#   - a pull request that changes this file: a short batch of six, to show it still works.
# The videos are split over parallel jobs (shards), one tab each, and every video is checked by
# scripts/check.py. Result: pulse-videos-<run>-ru and -en (videos and captions) and
# pulse-videos-<run>-plan (events.json and the posting schedule), kept 14 days.
on:
  workflow_dispatch:
    inputs:
      templates:
        description: Templates, comma separated (event, guess, top3, counter, timelapse, split, volume, traps, pulse)
        default: event,guess,top3,counter,timelapse,split,volume,traps,pulse
      max:
        description: Render only video numbers up to this
        default: "400"
      lang:
        description: Language of the set
        type: choice
        options: [both, ru, en]
        default: both
      sfx:
        description: Also render each video with Pulse's own sound effects (pulse-NNN-sfx.mp4)
        type: boolean
        default: false
      refresh_events:
        description: Look for new events in Binance's archive first (scripts/archive-events.mjs)
        type: boolean
        default: false
      days:
        description: Days of archive to look through when refreshing
        default: "30"
      shards:
        description: Parallel jobs per language
        default: "8"
  push:
    tags: ["video-batch-*"]
  pull_request:
    paths:
      - .github/workflows/video.yml

env:
  TEMPLATES: ${{ inputs.templates || 'event,guess,top3,counter,timelapse,split,volume,traps,pulse' }}
  # a pull request renders six to prove the workflow; a tag or a manual run the batch
  MAX: ${{ inputs.max || (github.event_name == 'pull_request' && '6' || '400') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: New events from the archive
        if: inputs.refresh_events
        run: npm run archive -- --days "${{ inputs.days }}" --max 60
      - id: matrix
        env:
          LANG_INPUT: ${{ inputs.lang || 'both' }}
          SHARDS: ${{ inputs.shards || (github.event_name == 'pull_request' && '2' || '8') }}
        run: |
          langs='["ru","en"]'
          [ "$LANG_INPUT" = ru ] && langs='["ru"]'
          [ "$LANG_INPUT" = en ] && langs='["en"]'
          shards=$(node -e "console.log(JSON.stringify([...Array(Number(process.env.SHARDS)).keys()]))")
          echo "matrix={\"lang\":$langs,\"shard\":$shards,\"of\":[${SHARDS}]}" >> "$GITHUB_OUTPUT"
      # captions for every number (nothing rendered: --only 0) and the posting schedule
      - run: |
          node scripts/render.mjs --only 0 --out out
          node scripts/render.mjs --only 0 --out out/en --lang en
          node scripts/schedule.mjs --days 60
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-videos-${{ github.run_number }}-plan
          path: |
            video/out/**/captions.txt
            video/out/schedule.csv
            video/public/events.json
          retention-days: 14
      # the shards render the same events, refreshed or not
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: video/public/*.json
          retention-days: 1

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: video/public
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ffmpeg for check.py, emoji for the captions in the frames; Chrome is on the runner already
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
          pip install numpy
      - run: npm ci
      - name: Render shard ${{ matrix.shard }} of ${{ matrix.of }}, ${{ matrix.lang }}
        env:
          CHROME: /usr/bin/google-chrome
          LOG: warn
        run: |
          npm run render -- --template "$TEMPLATES" --max "$MAX" --lang ${{ matrix.lang }} --shard ${{ matrix.shard }}/${{ matrix.of }} --out out
          if [ "${{ inputs.sfx }}" = "true" ]; then
            npm run render -- --template "$TEMPLATES" --max "$MAX" --lang ${{ matrix.lang }} --shard ${{ matrix.shard }}/${{ matrix.of }} --out out --sfx
          fi
      - name: Check every video for broken frames
        run: python3 scripts/check.py out/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ github.run_number }}-${{ matrix.lang }}-${{ matrix.shard }}
          path: video/out/*.mp4
          retention-days: 1
          compression-level: 0

  collect:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.matrix).lang }}
    steps:
      # one artifact per language out of the shards' pieces
      - uses: actions/upload-artifact/merge@v4
        with:
          name: pulse-videos-${{ github.run_number }}-${{ matrix.lang }}
          pattern: shard-${{ github.run_number }}-${{ matrix.lang }}-*
          retention-days: 14
          compression-level: 0
          delete-merged: true
