spring:
  application:
    name: pulse-backend
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

pulse:
  binance:
    enabled: true
    rest-url: https://fapi.binance.com
    # the legacy /stream endpoint accepts subscriptions but delivers nothing
    stream-url: wss://fstream.binance.com/market/stream
    # order book diff streams are only served on the public endpoint
    public-stream-url: wss://fstream.binance.com/public/stream
    # a 1000-level snapshot costs 20 weight; one per second stays well inside the 2400/min budget
    depth-snapshots-per-second: 1
    weight-limit: 2000
    kline-history: 120
    max-streams-per-connection: 800
    rest-requests-per-second: 15
    open-interest-poll: 60s
    stale-after: 30s
  stream:
    broadcast-interval-ms: 500
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  density:
    enabled: true
    books: 60
    reselect-interval: 10m
    scan-interval-ms: 1000
    max-distance-pct: 5
    prune-distance-pct: 10
    bucket-pct: 0.05
    multiple: 8
    min-notional: 25000
    volume-share: 0.0003
    max-per-side: 3
